name: weekly-digest

on:
  schedule:
    # 23:06 UTC Tuesday = 07:06 WITA Wednesday. GitHub's queue runs it 60–95
    # min late, so it actually lands ~08:05–08:40 Bali. Off-minute dodges the
    # on-the-hour GH Actions cron pile-up.
    - cron: "6 23 * * 2"
    # Monday 03:00 UTC = 11:00 WITA: dry-run the coming issue (no send) so a thin or broken one shows up red a day early.
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      only:
        description: "Test: send only to this address (skips the weekly once-per-address record)"
        required: false
        default: ""
      deals:
        description: "Open the issue with this week's deals (1 = yes)"
        required: false
        default: ""

concurrency:
  group: weekly-digest
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger digest send
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ONLY: ${{ inputs.only }}
          DEALS: ${{ inputs.deals || '1' }}
          PREFLIGHT: ${{ github.event.schedule == '0 3 * * 1' }}
        run: |
          set -euo pipefail
          query=""
          if [ -n "${ONLY:-}" ]; then query="only=$(printf %s "$ONLY" | jq -sRr @uri)"; fi
          if [ "${DEALS:-}" = "1" ]; then query="${query:+$query&}deals=1"; fi
          query="${query:+$query&}picks=1"
          if [ "${PREFLIGHT}" = "true" ]; then query="${query}&dry=1&html=1&asof=$(date -u -d '+2 days' +%F)"; fi
          response=$(curl -fsS -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://theubudian.life/api/cron/weekly-digest?${query}")
          # Keep the rendered sample as a file (not in the log) for the Reviewer.
          if [ "${PREFLIGHT}" = "true" ]; then
            echo "${response}" | jq -r '.data.html // empty' > issue-preview.html
            response=$(echo "${response}" | jq -c 'del(.data.html)')
          fi
          echo "Response: ${response}"
          # A red run is the alarm.
          if [ "${PREFLIGHT}" = "true" ]; then
            # Preflight: fail if the coming issue would be thin (no deals, no picks and under 3 events).
            echo "${response}" | jq -e '.data | ((.deals | length) > 0) or ((.picks | length) > 0) or (.events >= 3)' > /dev/null \
              || { echo "::error::Coming issue is thin: ${response}"; exit 1; }
          else
            # Send: fail if nobody got it, or more than 1 in 5 failed (a re-run that only skips duplicates is fine).
            echo "${response}" | jq -e '.data | (.recipients == 0) or (.skipped_duplicate > 0 and .sent == 0) or (.sent > 0 and (.failed * 5) <= .recipients)' > /dev/null \
              || { echo "::error::Weekly email problem: ${response}"; exit 1; }
          fi
      - name: Keep the coming issue for the Reviewer
        if: ${{ github.event.schedule == '0 3 * * 1' }}
        uses: actions/upload-artifact@v4
        with:
          name: coming-issue
          path: issue-preview.html

