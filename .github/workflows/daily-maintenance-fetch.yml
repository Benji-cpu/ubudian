name: daily-maintenance-fetch

on:
  schedule:
    # 19:02 UTC ≈ 03:02 WITA — 15 minutes before the Claude Code remote trigger
    # (trig_01CnuNJSs8m8wdVyeVrDHrKq) fires at 19:17 UTC and reads the JSON
    # this workflow commits. Off-minute (`02`) deliberately dodges the
    # quarter-hour cron pile-up, where GH Actions has been observed drifting
    # 30+ minutes during peak load (incident: 2026-05-06 ran at 19:55 UTC).
    - cron: "2 19 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-maintenance-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Compute Bali date
        id: date
        run: echo "today=$(TZ=Asia/Makassar date +%F)" >> "$GITHUB_OUTPUT"

      - name: Fetch maintenance payload
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          TODAY: ${{ steps.date.outputs.today }}
        run: |
          set -euo pipefail
          mkdir -p digests
          curl -fsS \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://theubudian.life/api/cron/daily-maintenance?digest=true" \
            -o "digests/${TODAY}.json"
          jq -e '.startedAt' "digests/${TODAY}.json" > /dev/null

      # Liveness → Ben's board. The route reports `liveness.stale` when nothing
      # has been published for 48h. A digest line is not enough — the digest
      # is the surface nobody reads on the day it matters — so the workflow
      # (which has egress) files a CRM row. `dedupeKey` keeps it to one row.
      - name: File a CRM row if the site is stale
        env:
          TODAY: ${{ steps.date.outputs.today }}
          CRM_HANDOVER_URL: ${{ secrets.CRM_HANDOVER_URL }}
          CRM_HANDOVER_SECRET: ${{ secrets.CRM_HANDOVER_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${CRM_HANDOVER_URL:-}" ]; then echo "CRM_HANDOVER_URL secret not set — skipping"; exit 0; fi
          STALE=$(jq -r '.liveness.stale // true' "digests/${TODAY}.json")
          UNMOD=$(jq -r '.autoApprove.moderationFailedOpen // 0' "digests/${TODAY}.json")
          if [ "$STALE" != "true" ] && [ "$UNMOD" = "0" ]; then echo "live and moderated — no row"; exit 0; fi
          LINE=$(jq -r '.liveness.line // "liveness block missing"' "digests/${TODAY}.json")
          if [ "$STALE" = "true" ]; then
            TITLE="Ubudian: nothing published for 48h — the agenda is going stale"
            PRIORITY="blocking"
            IMPACT="The homepage and /events stop filling; visitors see last week's rhythms and none of this week's one-offs."
            KEY="ubudian-liveness-stale"
          else
            TITLE="Ubudian: ${UNMOD} events published without a moderation verdict"
            PRIORITY="soon"
            IMPACT="Gemini errored on the gate; the structural screen was the only filter for these rows."
            KEY="ubudian-gate-unmoderated"
          fi
          jq -n --arg t "$TITLE" --arg p "$PRIORITY" --arg i "$IMPACT" --arg k "$KEY" --arg line "$LINE" --arg d "$TODAY" '{
            title: $t, app: "ubudian", priority: $p, impact: $i, dedupeKey: $k, source: "daily-maintenance-fetch",
            notes: ("Payload " + $d + ": " + $line),
            steps: [
              {text: "Read tonight'"'"'s digest and payload", url: ("https://github.com/Benji-cpu/ubudian/blob/main/digests/" + $d + ".md")},
              {text: "Check the harvest workflows ran green", url: "https://github.com/Benji-cpu/ubudian/actions"},
              {text: "Check Vercel logs for /api/cron/daily-maintenance", url: "https://vercel.com/bens-projects-9fc2e88a/ubudian-v1/logs"},
              {text: "If Gemini is 429ing: raise the quota on the Gemini project", url: "https://aistudio.google.com/apikey"}
            ],
            links: [{label: "Live agenda", url: "https://theubudian.life/events"}]
          }' > /tmp/handover.json
          curl -fsS -X POST -H "Authorization: Bearer $CRM_HANDOVER_SECRET" -H "Content-Type: application/json" \
            --data @/tmp/handover.json "$CRM_HANDOVER_URL" || echo "CRM handover failed (non-fatal)"

      - name: Commit JSON to main
        env:
          TODAY: ${{ steps.date.outputs.today }}
        run: |
          set -euo pipefail
          git config user.name  "ubudian-bot"
          git config user.email "ubudian-bot@users.noreply.github.com"
          git add "digests/${TODAY}.json"
          if git diff --cached --quiet; then
            echo "No change in payload — nothing to commit."
            exit 0
          fi
          git commit -m "digest payload: ${TODAY} (auto)"
          git push origin HEAD:main
