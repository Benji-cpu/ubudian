name: tag-embed-sweep

# Going-forward safety net for the personalisation engine. New events are tagged
# (archetype_tags + vibe_tags) at ingestion by the LLM parser, but their EMBEDDING
# is deferred (kept off the Vercel 10s ingest budget). This workflow embeds any
# event still missing a vector and backfills any straggler that slipped through
# without tags. The sandboxed nightly Claude agent can't reach Gemini/Supabase
# (egress allowlist), and Vercel Hobby is capped at 2 crons — GH Actions is the
# right executor: unrestricted egress + holds the secrets, no cron-count cost.
#
# REQUIRES repo secrets (not yet set — add via `gh secret set` or the GH UI):
#   NEXT_PUBLIC_SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, GEMINI_API_KEY
# Until they exist the run no-ops/fails fast and nothing is harmed; the existing
# corpus is already fully embedded + tagged.

on:
  schedule:
    # 18:40 UTC ≈ 02:40 WITA — ahead of the maintenance (19:02) + curator (19:47)
    # jobs, off the quarter-hour to dodge GH cron pile-up.
    # 18:55 — was 18:40, colliding with aggregator-harvest (both written
    # independently). Moved 2026-09-15.
    - cron: "55 18 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: tag-embed-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Embed any new events
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          # Embeddings are a different Gemini model with their own allowance and
          # they work. This step stays hard-failing: red here is real.
          npx tsx scripts/embed-events-backfill.ts --limit 60 --concurrency 2

      # SPLIT OUT AND NON-FATAL, 2026-09-21. These two cannot go green until the
      # Gemini key has billing, and no amount of tuning here will change that.
      # Measured 2026-09-16: the 429 names its own quota, `GenerateRequestsPerDay
      # PerProjectPerModel-FreeTier`, limit 20 requests per DAY per model; the two
      # scripts need ~80 a night. Concurrency 5/4/4 → 2 did not help (4 of 40
      # succeeded); pacing to 10/min did not help (0 of 40, same 20/day underneath);
      # a run started just after the midnight-Pacific reset got exactly 22 through
      # and failed the remaining 18.
      #
      # Leaving the job red on that known limit mailed Ben a "Run failed" every
      # night for a fact he already has filed as CRM #331, and taught him to ignore
      # the one channel that reports real breakage. The step still runs and its log
      # still says what happened — it just no longer fails the job. Put `set -e`
      # back the day billing is on.
      - name: Tag any untagged events (non-fatal — Gemini free-tier quota, CRM #331)
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -uo pipefail
          npx tsx scripts/backfill-archetype-tags.ts --limit 40 --concurrency 2
          npx tsx scripts/backfill-vibe-tags.ts --limit 40 --concurrency 2
