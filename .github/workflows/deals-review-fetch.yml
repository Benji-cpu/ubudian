name: deals-review-fetch

# Leg 1 of the daily deals review (git-as-bus, like curator-ingest): fetch what
# venues have submitted and commit it for the Claude routine
# (.claude/agents/deals-reviewer.md), which can't reach theubudian.life.
# The route returns PUBLIC fields only — this repo is public.
#
# GH scheduled runs land 60–95 min late (CLAUDE.md), so 17:33 UTC lands
# ~18:35–19:10; the routine fires at 20:13 UTC (04:13 Bali), after it.

on:
  schedule:
    - cron: "33 17 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: deals-review-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Compute Bali date
        id: date
        run: echo "today=$(TZ=Asia/Makassar date +%F)" >> "$GITHUB_OUTPUT"

      - name: Fetch pending deals
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          TODAY: ${{ steps.date.outputs.today }}
        run: |
          set -euo pipefail
          mkdir -p deals-review/pending
          curl -fsS -H "Authorization: Bearer $CRON_SECRET" \
            "https://theubudian.life/api/cron/deals-review" -o /tmp/pending.json
          jq -e '.count | numbers' /tmp/pending.json > /dev/null
          COUNT=$(jq '.count' /tmp/pending.json)
          echo "pending: $COUNT"
          if [ "$COUNT" -eq 0 ]; then echo "nothing waiting — no commit"; exit 0; fi
          cp /tmp/pending.json "deals-review/pending/${TODAY}.json"

      - name: Commit
        env:
          TODAY: ${{ steps.date.outputs.today }}
        run: |
          set -euo pipefail
          [ -f "deals-review/pending/${TODAY}.json" ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "deals-review/pending/${TODAY}.json"
          git diff --cached --quiet && exit 0
          git commit -m "deals review: pending ${TODAY} (auto)"
          git pull --rebase origin main
          git push origin HEAD:main
