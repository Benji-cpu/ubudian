name: deals-review-apply

# Leg 2: when the routine commits deals-review/decisions/<date>.json, POST the
# decisions to the site, which publishes, flags or rejects each deal.

on:
  push:
    branches: [main]
    paths:
      - 'deals-review/decisions/**.json'
  workflow_dispatch:
    inputs:
      date:
        description: 'Decisions date (YYYY-MM-DD). Defaults to the newest file.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: deals-review-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Post decisions
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          INPUT_DATE: ${{ inputs.date }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_DATE:-}" ]; then FILE="deals-review/decisions/${INPUT_DATE}.json"
          else FILE=$(ls -1 deals-review/decisions/*.json | sort | tail -n 1); fi
          echo "applying $FILE"
          jq -e '.decisions | arrays' "$FILE" > /dev/null
          curl -fsS -X POST -H "Authorization: Bearer $CRON_SECRET" -H "Content-Type: application/json" \
            --data @"$FILE" "https://theubudian.life/api/cron/deals-review" | tee /tmp/report.json
          jq -e '.data' /tmp/report.json > /dev/null
